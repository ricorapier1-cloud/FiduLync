name: FiduLync quality gates

on:
  pull_request:
  push:
    branches: [main, feat/algolync-marketplace-rebuild]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Existing repository-wide lint baseline
        run: npm run lint
        continue-on-error: true
      - name: Lint changed MT5 integration files
        run: npx eslint app/api/mt5/ingest/route.ts app/api/mt5/installations/route.ts app/owner/page.tsx lib/technicalEngine.ts
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          NEXT_PUBLIC_APP_URL: https://fidulync.vercel.app
