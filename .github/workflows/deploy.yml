name: Production DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fidulync-production-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed production source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Quantitative governance tests
        run: npm run test:quant

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production dependency security
        run: npm audit --omit=dev --audit-level=high

      - name: Setup Supabase CLI
        if: ${{ vars.DEPLOY_SUPABASE_EDGE_FUNCTIONS == 'true' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Functions
        if: ${{ vars.DEPLOY_SUPABASE_EDGE_FUNCTIONS == 'true' }}
        run: |
          supabase functions deploy resolve-bank-holder --no-verify-jwt
          supabase functions deploy ea-webhook-sync --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Report skipped Supabase deployment
        if: ${{ vars.DEPLOY_SUPABASE_EDGE_FUNCTIONS != 'true' }}
        run: echo "::notice::Supabase Edge Function deployment skipped; set DEPLOY_SUPABASE_EDGE_FUNCTIONS and SUPABASE_ACCESS_TOKEN to enable it."

      - name: Deploy reviewed build to Vercel
        if: ${{ vars.DEPLOY_VERCEL == 'true' }}
        run: npx vercel --prod --confirm
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Report skipped Vercel deployment
        if: ${{ vars.DEPLOY_VERCEL != 'true' }}
        run: echo "::notice::Vercel deployment skipped; configure DEPLOY_VERCEL and VERCEL_TOKEN to enable production deployment."
