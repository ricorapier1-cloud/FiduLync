name: Production DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript, Lint, and Production Build
        run: |
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Functions
        if: ${{ vars.DEPLOY_SUPABASE_EDGE_FUNCTIONS == 'true' }}
        run: |
          supabase functions deploy resolve-bank-holder --no-verify-jwt
          supabase functions deploy ea-webhook-sync --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Production Build to Vercel
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --confirm
