name: Production DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Install Node.js Engine
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify TypeScript, Lint, Tests and Production Build
        run: npm run build

      - name: Deploy Production Build to Vercel
        if: ${{ vars.DEPLOY_VERCEL == 'true' }}
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --confirm

      - name: Report skipped Vercel deployment
        if: ${{ vars.DEPLOY_VERCEL != 'true' }}
        run: echo "::notice::Vercel deployment skipped; set the DEPLOY_VERCEL repository variable and VERCEL_TOKEN secret to enable it."
