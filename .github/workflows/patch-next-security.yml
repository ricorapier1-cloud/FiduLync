name: Apply Next.js security patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-next-security.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade patched Next.js and refresh lockfile
        run: npm install --save-exact next@16.4.6 eslint-config-next@16.4.6

      - name: Apply compatible transitive security fixes
        run: npm audit fix

      - name: Verify production dependency audit
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lockfile already matches the patched versions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to patched 16.4.6"
          git push origin HEAD:main
