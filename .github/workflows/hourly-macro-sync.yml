name: Hourly MacroLync Telemetry Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check optional cron secret
        id: cron-secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CRON_SECRET is not configured in GitHub Actions. The scheduled macro refresh is being skipped safely."
            {
              echo "### Macro refresh skipped"
              echo "Add the GitHub Actions repository secret CRON_SECRET with the same value as Vercel's CRON_SECRET to enable the hourly refresh."
              echo "The application can still refresh macro data on demand."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping MacroLync Cron Endpoint
        if: steps.cron-secret.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --max-time 30 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://fidulync.vercel.app/api/cron/sync-macro

      - name: Report scheduled refresh status
        if: steps.cron-secret.outputs.configured == 'true'
        run: echo "The authenticated MacroLync refresh endpoint returned successfully."
