name: Pull Request Quality Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Quant governance unit tests
        run: npm run test:quant
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Setup Python for MT5 publisher syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MT5 publisher syntax
        run: python -m py_compile scripts/mt5_market_publisher.py
