name: Pull Request Quality Gate
# Validate the private Personal Quant Edition, source provenance, owner security and MT5 research tooling.

on:
  pull_request:
    branches: [main, feat/personal-quant-edition]
  push:
    branches: [feat/personal-quant-edition, refactor/institutional-terminal-navigation]

concurrency:
  group: personal-quant-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency vulnerability summary
        run: |
          npm audit --json > /tmp/fidulync-npm-audit.json || true
          node -e "const r=require('/tmp/fidulync-npm-audit.json'); const v=r.vulnerabilities||{}; console.log('Dependency audit totals:', JSON.stringify(r.metadata?.vulnerabilities||{})); for (const [name,item] of Object.entries(v)) console.log(name, 'severity='+item.severity, 'direct='+item.isDirect, 'fixAvailable='+JSON.stringify(item.fixAvailable));"
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Quant governance unit tests
        run: npm run test:quant
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Setup Python for MT5 publisher syntax check
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate MT5 publisher and historical backfill syntax
        run: python -m py_compile scripts/mt5_market_publisher.py scripts/mt5_historical_backfill.py scripts/mt5_risk_state.py
      - name: MT5 risk telemetry unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
