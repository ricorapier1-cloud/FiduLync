name: Pull Request Quality Gate
# Revalidate the complete Personal Quant and preserved legacy licensing workflows after the November 18 risk-anchor freshness helper tests.

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/personal-quant-edition]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency vulnerability summary
        run: |
          npm audit --json > /tmp/fidulync-npm-audit.json || true
          node -e "const r=require('/tmp/fidulync-npm-audit.json'); const v=r.vulnerabilities||{}; console.log('Dependency audit totals:', JSON.stringify(r.metadata?.vulnerabilities||{})); for (const [name,item] of Object.entries(v)) console.log(name, 'severity='+item.severity, 'direct='+item.isDirect, 'fixAvailable='+JSON.stringify(item.fixAvailable));"
      - name: Enforce production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Quant governance unit tests
        run: npm run test:quant
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Setup Python for MT5 publisher syntax check
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate MT5 publisher syntax
        run: python -m py_compile scripts/mt5_market_publisher.py scripts/mt5_risk_state.py
      - name: MT5 risk telemetry unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
